<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#4ec0ca">
<title>SWAppy Bird</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(#4ec0ca, #a8e6cf);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Trebuchet MS', Arial, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  body {
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    box-sizing: border-box;
  }
  #gameContainer {
    position: relative;
    box-shadow: 0 10px 40px rgba(0,0,0,0.35);
    border-radius: 8px;
    overflow: hidden;
    touch-action: none;
  }
  canvas {
    display: block;
    background: linear-gradient(#70c5ce, #b8e8e0);
    cursor: pointer;
    touch-action: none;
  }
  #overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    background: rgba(0,0,0,0.15);
    text-align: center;
    padding: 20px;
    box-sizing: border-box;
  }
  #overlay h1 {
    font-size: calc(34px * var(--ui-scale, 1));
    margin: 0 0 10px;
  }
  #overlay p {
    font-size: calc(17px * var(--ui-scale, 1));
    margin: 4px 0;
  }
  #overlay .hint {
    margin-top: 20px;
    font-size: calc(15px * var(--ui-scale, 1));
    opacity: 0.9;
  }
  #airportLabel {
    position: absolute;
    left: 50%;
    bottom: 15%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    color: #000;
    text-shadow: 1px 1px 2px rgba(255,255,255,0.5);
    text-align: center;
    z-index: 4;
    user-select: none;
    pointer-events: none;
  }
  #airportCity {
    font-size: calc(17px * var(--ui-scale, 1));
    font-weight: bold;
  }
  #airportCode {
    font-size: calc(14px * var(--ui-scale, 1));
    font-weight: bold;
    letter-spacing: 1px;
    opacity: 0.9;
  }
  #scoreDisplay {
    position: absolute;
    top: calc(20px * var(--ui-scale, 1));
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    color: #fff;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    text-align: center;
    z-index: 5;
    user-select: none;
    pointer-events: none;
  }
  #scoreNumber {
    font-size: calc(40px * var(--ui-scale, 1));
    font-weight: bold;
    line-height: 1.1;
  }
  #scoreLabel {
    font-size: calc(15px * var(--ui-scale, 1));
    font-weight: bold;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    opacity: 0.9;
  }
  #rewardsLabel {
    font-size: calc(13px * var(--ui-scale, 1));
    font-weight: bold;
    letter-spacing: 0.3px;
    color: #FFBF27;
    margin-top: 2px;
  }
</style>
</head>
<body>
<div id="gameContainer">
  <div id="scoreDisplay">
    <span id="scoreNumber">0</span>
    <span id="scoreLabel">Destinations Visited</span>
    <span id="rewardsLabel">0 Rapid Rewards Points</span>
  </div>
  <div id="airportLabel">
    <span id="airportCity"></span>
    <span id="airportCode"></span>
  </div>
  <canvas id="game" width="400" height="600"></canvas>
  <div id="overlay">
    <h1>SWAppy Bird</h1>
    <p>Click, tap, or press Space to FLY<br><br>Fly through the LUV Hearts to collect Rapid Rewards Points</p>
    <p class="hint">Click to start</p>
  </div>
</div>

const PLANE_ASPECT = 0.315; // sprite height / width


const W = canvas.width;
const H = canvas.height;

// Render at device pixel ratio for crisp visuals on Retina iPhone screens,
// while all game logic keeps using the logical W x H coordinate space.
const DPR = Math.min(window.devicePixelRatio || 1, 3);
canvas.width = W * DPR;
canvas.height = H * DPR;
ctx.scale(DPR, DPR);

function fitToScreen() {
  const availW = window.innerWidth;
  const availH = window.innerHeight;
  const aspect = W / H;

  let displayW = availW;
  let displayH = displayW / aspect;
  if (displayH > availH) {
    displayH = availH;
    displayW = displayH * aspect;
  }

  canvas.style.width = displayW + 'px';
  canvas.style.height = displayH + 'px';
  gameContainer.style.width = displayW + 'px';
  gameContainer.style.height = displayH + 'px';
  gameContainer.style.setProperty('--ui-scale', (displayW / W).toFixed(4));
}

window.addEventListener('resize', fitToScreen);
window.addEventListener('orientationchange', fitToScreen);
fitToScreen();

// Prevent iOS Safari's pinch-zoom and double-tap-to-zoom from interfering with tapping
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('gesturechange', (e) => e.preventDefault());
let lastTouchEnd = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) e.preventDefault();
  lastTouchEnd = now;
}, { passive: false });
document.body.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

function formatAirport(entry) {
  const [raw, icao] = entry;
  const lastComma = raw.lastIndexOf(',');
  let city = raw, region = '';
  if (lastComma !== -1) {
    city = raw.slice(0, lastComma).trim();
    region = raw.slice(lastComma + 1).trim();
  }
  if (STATE_NAMES[region]) region = STATE_NAMES[region];
  return { line1: region ? (city + ', ' + region) : city, line2: icao };
}

function buildAirportQueue() {
  const forcedCodes = ['KDAL', 'KSAT', 'KHOU'];
  const forced = forcedCodes.map(code => AIRPORTS_RAW.find(a => a[1] === code));
  const rest = AIRPORTS_RAW.filter(a => forcedCodes.indexOf(a[1]) === -1);
  for (let i = rest.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = rest[i]; rest[i] = rest[j]; rest[j] = tmp;
  }
  return forced.concat(rest);
}

let airportIndex = 0;
showAirport(airportIndex);

function showAirport(index) {
  const entry = airportQueue[index % airportQueue.length];
  const { line1, line2 } = formatAirport(entry);
  airportCityEl.textContent = line1;
  airportCodeEl.textContent = line2;
}


const GRAVITY = 0.32;
const FLAP_STRENGTH = -4.8;
const OBSTACLE_WIDTH = 64;
const MAX_CLOUD_HEIGHT = 165;   // max drop from the top
const MIN_CLOUD_HEIGHT = 70;
const MAX_TOWER_HEIGHT = 175;   // max rise from the ground
const MIN_TOWER_HEIGHT = 95;
const OBSTACLE_SPEED = 2.3;
const CLOUD_SPAWN_INTERVAL = 118;  // frames
const TOWER_SPAWN_INTERVAL = 135;  // frames
const SPEEDUP_EVERY = 7;           // points between speed increases
const SPEEDUP_FACTOR = 1.07;       // 7% faster each time
const GROUND_HEIGHT = 80;
const HEART_SIZE = 34;
const HEART_START_AIRPORT_INDEX = 3; // 4th airport (0-indexed)
const HEART_MIN_INTERVAL = 2;        // airports between hearts
const HEART_MAX_INTERVAL = 7;

let state = 'ready'; // ready, playing, gameover
let frame = 0;
let score = 0;
let best = Number(localStorageSafeGet('flappyBest')) || 0;

const bird = {
  x: W * 0.3,
  y: H * 0.4,
  r: 18,
  vy: 0,
  rotation: 0
};

let clouds = [];
let towers = [];
let hearts = [];
let groundOffset = 0;
let currentSpeed = OBSTACLE_SPEED;
let distanceTraveled = 0;
let nextHeartAirportIndex = HEART_START_AIRPORT_INDEX;
let rapidRewards = 0;
let heartsCollected = 0;
let heartValue = 1000;
let fibA = 1;
let fibB = 2; // next hearts-collected threshold that bumps the value

function localStorageSafeGet(key) {
  try {
    return null; // storage disabled in artifact sandbox; keep best score in-memory only
  } catch (e) {
    return null;
  }
}

function resetGame() {
  bird.y = H * 0.4;
  bird.vy = 0;
  bird.rotation = 0;
  clouds = [];
  towers = [];
  hearts = [];
  frame = 0;
  score = 0;
  currentSpeed = OBSTACLE_SPEED;
  distanceTraveled = 0;
  scoreNumber.textContent = 0;
  airportQueue = buildAirportQueue();
  airportIndex = 0;
  nextHeartAirportIndex = HEART_START_AIRPORT_INDEX;
  rapidRewards = 0;
  heartsCollected = 0;
  heartValue = 1000;
  fibA = 1;
  fibB = 2;
  rewardsLabel.textContent = '0 Rapid Rewards Points';
  showAirport(airportIndex);
}

const HEART_CLEARANCE = 16; // required gap between hearts and clouds/towers

function spawnHeart() {
  const minY = 70;
  const maxY = H - GROUND_HEIGHT - 70;
  const heartX0 = W;
  const heartX1 = W + HEART_SIZE;

  // Any cloud/tower whose x-range currently overlaps where this heart spawns will
  // keep the same relative x-gap forever (everything scrolls at the same speed),
  // so avoiding them right now is sufficient to avoid them permanently.
  const forbidden = [];
  for (const c of clouds) {
    if (c.x < heartX1 && c.x + OBSTACLE_WIDTH > heartX0) {
      forbidden.push([-999, c.height + HEART_CLEARANCE]);
    }
  }
  for (const t of towers) {
    if (t.x < heartX1 && t.x + OBSTACLE_WIDTH > heartX0) {
      const towerTop = (H - GROUND_HEIGHT) - t.height;
      forbidden.push([towerTop - HEART_CLEARANCE, 999]);
    }
  }

  function conflicts(y) {
    const y0 = y - HEART_SIZE / 2;
    const y1 = y + HEART_SIZE / 2;
    return forbidden.some(([f0, f1]) => y1 > f0 && y0 < f1);
  }

  let y = null;
  for (let i = 0; i < 30; i++) {
    const candidate = Math.random() * (maxY - minY) + minY;
    if (!conflicts(candidate)) { y = candidate; break; }
  }
  if (y === null) {
    for (let candidate = minY; candidate <= maxY; candidate += 4) {
      if (!conflicts(candidate)) { y = candidate; break; }
    }
  }
  if (y === null) return; // no safe gap right now; skip this spawn rather than force an overlap

  hearts.push({ x: W, y });
}

function collectHeart() {
  heartsCollected++;
  if (heartsCollected === fibB) {
    heartValue += 1000;
    const next = fibA + fibB;
    fibA = fibB;
    fibB = next;
  }
  rapidRewards += heartValue;
  rewardsLabel.textContent = rapidRewards.toLocaleString() + ' Rapid Rewards Points';
}

function spawnCloud() {
  const cloudX0 = W, cloudX1 = W + OBSTACLE_WIDTH;
  const blockingHearts = hearts.filter(h => h.x < cloudX1 && h.x + HEART_SIZE > cloudX0);

  let maxSafeHeight = MAX_CLOUD_HEIGHT;
  for (const h of blockingHearts) {
    const limit = (h.y - HEART_SIZE / 2) - HEART_CLEARANCE;
    maxSafeHeight = Math.min(maxSafeHeight, limit);
  }
  if (maxSafeHeight < MIN_CLOUD_HEIGHT) return; // no safe height right now; skip this spawn

  const height = Math.random() * (maxSafeHeight - MIN_CLOUD_HEIGHT) + MIN_CLOUD_HEIGHT;
  clouds.push({ x: W, height });
}

function spawnTower() {
  const towerX0 = W, towerX1 = W + OBSTACLE_WIDTH;
  const blockingHearts = hearts.filter(h => h.x < towerX1 && h.x + HEART_SIZE > towerX0);

  let maxSafeHeight = MAX_TOWER_HEIGHT;
  for (const h of blockingHearts) {
    const limit = (H - GROUND_HEIGHT) - (h.y + HEART_SIZE / 2) - HEART_CLEARANCE;
    maxSafeHeight = Math.min(maxSafeHeight, limit);
  }
  if (maxSafeHeight < MIN_TOWER_HEIGHT) return; // no safe height right now; skip this spawn

  const height = Math.random() * (maxSafeHeight - MIN_TOWER_HEIGHT) + MIN_TOWER_HEIGHT;
  towers.push({ x: W, height, passed: false });
}

function flap() {
  if (state === 'ready') {
    state = 'playing';
    overlay.style.display = 'none';
    resetGame();
    bird.vy = FLAP_STRENGTH;
  } else if (state === 'playing') {
    bird.vy = FLAP_STRENGTH;
  } else if (state === 'gameover') {
    state = 'ready';
    overlay.querySelector('h1').textContent = 'SWAppy Bird';
    overlay.querySelector('p').innerHTML = 'Click, tap, or press Space to FLY<br><br>Fly through the LUV Hearts to collect Rapid Rewards Points';
    overlay.querySelector('.hint').textContent = 'Click to start';
    overlay.style.display = 'flex';
  }
}

function update() {
  if (state !== 'playing') return;

  frame++;

  // Bird physics
  bird.vy += GRAVITY;
  bird.y += bird.vy;
  bird.rotation = Math.max(-0.5, Math.min(1.2, bird.vy * 0.08));

  // Ground scroll
  groundOffset -= currentSpeed;
  if (groundOffset <= -24) groundOffset = 0;
  distanceTraveled += currentSpeed;

  // Spawn clouds and towers on independent timers (they don't have to line up)
  if (frame % CLOUD_SPAWN_INTERVAL === 0) {
    spawnCloud();
  }
  if (frame % TOWER_SPAWN_INTERVAL === 0) {
    spawnTower();
  }

  // Move clouds
  for (let i = clouds.length - 1; i >= 0; i--) {
    const c = clouds[i];
    c.x -= currentSpeed;
    if (c.x + OBSTACLE_WIDTH < -20) clouds.splice(i, 1);
  }

  // Move towers
  for (let i = towers.length - 1; i >= 0; i--) {
    const t = towers[i];
    t.x -= currentSpeed;

    // Reaching a destination: score when the bird flies past a tower
    if (!t.passed && t.x + OBSTACLE_WIDTH < bird.x) {
      t.passed = true;
      score++;
      scoreNumber.textContent = score;
      airportIndex++;
      showAirport(airportIndex);
      if (airportIndex === nextHeartAirportIndex) {
        spawnHeart();
        nextHeartAirportIndex = airportIndex + HEART_MIN_INTERVAL +
          Math.floor(Math.random() * (HEART_MAX_INTERVAL - HEART_MIN_INTERVAL + 1));
      }
      if (score % SPEEDUP_EVERY === 0) {
        currentSpeed *= SPEEDUP_FACTOR;
      }
    }

    if (t.x + OBSTACLE_WIDTH < -20) towers.splice(i, 1);
  }

  // Move hearts and check for pickup
  for (let i = hearts.length - 1; i >= 0; i--) {
    const h = hearts[i];
    h.x -= currentSpeed;

    const dx = bird.x - h.x;
    const dy = bird.y - h.y;
    const hitRadius = bird.r + HEART_SIZE * 0.42;
    if (dx * dx + dy * dy < hitRadius * hitRadius) {
      hearts.splice(i, 1);
      collectHeart();
      continue;
    }

    if (h.x < -HEART_SIZE) hearts.splice(i, 1);
  }

  // Collisions with ground/ceiling
  if (bird.y + bird.r > H - GROUND_HEIGHT || bird.y - bird.r < 0) {
    endGame();
    return;
  }

  // Collisions with clouds (hang down from the top)
  for (const c of clouds) {
    const withinX = bird.x + bird.r > c.x && bird.x - bird.r < c.x + OBSTACLE_WIDTH;
    if (withinX && bird.y - bird.r < c.height) {
      endGame();
      return;
    }
  }

  // Collisions with towers (rise up from the ground)
  for (const t of towers) {
    const withinX = bird.x + bird.r > t.x && bird.x - bird.r < t.x + OBSTACLE_WIDTH;
    const towerTop = (H - GROUND_HEIGHT) - t.height;
    if (withinX && bird.y + bird.r > towerTop) {
      endGame();
      return;
    }
  }
}

function endGame() {
  state = 'gameover';
  if (score > best) best = score;
  overlay.querySelector('h1').textContent = 'Game Over';
  overlay.querySelector('p').innerHTML = 'Destinations Visited: ' + score + '<br>Best: ' + best +
    '<br>Rapid Rewards Points: ' + rapidRewards.toLocaleString();
  overlay.querySelector('.hint').textContent = 'Click to try again';
  overlay.style.display = 'flex';
}

function drawClouds() {
  for (const c of clouds) {
    const cx = c.x + OBSTACLE_WIDTH / 2;
    const baseY = c.height;
    ctx.fillStyle = '#f4f7fa';
    // Puffy overlapping circles hanging down from the top of the screen
    ctx.beginPath();
    ctx.arc(cx - 20, baseY - 34, 26, 0, Math.PI * 2);
    ctx.arc(cx + 6, baseY - 42, 30, 0, Math.PI * 2);
    ctx.arc(cx + 30, baseY - 30, 24, 0, Math.PI * 2);
    ctx.arc(cx - 4, baseY - 20, 32, 0, Math.PI * 2);
    ctx.fill();
    // Flat-ish bottom edge so the danger zone reads clearly
    ctx.fillRect(cx - 34, baseY - 22, 68, 24);
    ctx.beginPath();
    ctx.arc(cx - 34, baseY - 10, 12, 0, Math.PI * 2);
    ctx.arc(cx + 34, baseY - 10, 12, 0, Math.PI * 2);
    ctx.fill();
    // Soft shading
    ctx.fillStyle = 'rgba(180,195,210,0.5)';
    ctx.beginPath();
    ctx.ellipse(cx, baseY - 8, 30, 8, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawTowers() {
  for (const t of towers) {
    const towerTop = (H - GROUND_HEIGHT) - t.height;
    const cx = t.x + OBSTACLE_WIDTH / 2;
    const shaftW = OBSTACLE_WIDTH * 0.32;
    const cabH = 58;
    const neckH = 10;                 // narrow neck where cab meets shaft
    const cabTop = towerTop + 6;
    const neckBottom = towerTop + cabH;
    const cabBottom = neckBottom - neckH;
    const neckW = OBSTACLE_WIDTH * 0.4;
    const cabTopW = OBSTACLE_WIDTH * 0.92;   // widest point: the observation deck

    // Shaft (concrete column)
    ctx.fillStyle = '#d8dbe0';
    ctx.fillRect(cx - shaftW / 2, neckBottom, shaftW, (H - GROUND_HEIGHT) - neckBottom);
    ctx.strokeStyle = '#aeb4bb';
    ctx.lineWidth = 2;
    ctx.strokeRect(cx - shaftW / 2, neckBottom, shaftW, (H - GROUND_HEIGHT) - neckBottom);

    // Vertical shading line down the middle of the shaft
    ctx.strokeStyle = 'rgba(0,0,0,0.08)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(cx, neckBottom + 4);
    ctx.lineTo(cx, (H - GROUND_HEIGHT) - 4);
    ctx.stroke();

    // Horizontal bands on the shaft
    ctx.strokeStyle = '#aeb4bb';
    ctx.lineWidth = 1.5;
    for (let y = neckBottom + 16; y < (H - GROUND_HEIGHT); y += 20) {
      ctx.beginPath();
      ctx.moveTo(cx - shaftW / 2, y);
      ctx.lineTo(cx + shaftW / 2, y);
      ctx.stroke();
    }

    // Narrow neck connecting the shaft up to the cab
    ctx.fillStyle = '#aeb4bb';
    ctx.fillRect(cx - neckW / 2, cabBottom, neckW, neckBottom - cabBottom);

    // Observation cab: flares OUT as it rises, like a flying-saucer deck sitting on the shaft
    ctx.fillStyle = '#3a4652';
    ctx.beginPath();
    ctx.moveTo(cx - neckW / 2, cabBottom);
    ctx.lineTo(cx - cabTopW / 2, cabTop + 10);
    ctx.lineTo(cx - cabTopW / 2, cabTop);
    ctx.lineTo(cx + cabTopW / 2, cabTop);
    ctx.lineTo(cx + cabTopW / 2, cabTop + 10);
    ctx.lineTo(cx + neckW / 2, cabBottom);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#22282e';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Glass band wrapping the cab, with window mullions
    ctx.fillStyle = '#bfe4ef';
    ctx.fillRect(cx - cabTopW / 2 + 4, cabTop + 4, cabTopW - 8, 12);
    ctx.strokeStyle = '#22282e';
    ctx.lineWidth = 1.2;
    const mullions = 7;
    for (let i = 1; i < mullions; i++) {
      const mx = (cx - cabTopW / 2 + 4) + (i / mullions) * (cabTopW - 8);
      ctx.beginPath();
      ctx.moveTo(mx, cabTop + 4);
      ctx.lineTo(mx, cabTop + 16);
      ctx.stroke();
    }

    // Roof cap (flat disc on top, slightly overhanging)
    ctx.fillStyle = '#DC1C24';
    ctx.fillRect(cx - cabTopW / 2 - 3, cabTop - 6, cabTopW + 6, 7);
    ctx.fillStyle = '#22282e';
    ctx.fillRect(cx - cabTopW / 2 - 3, cabTop, cabTopW + 6, 3);

    // Short beacon light on top (not a tall antenna)
    ctx.strokeStyle = '#4a5157';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx, cabTop - 6);
    ctx.lineTo(cx, cabTop - 13);
    ctx.stroke();
    ctx.fillStyle = '#FFBF27';
    ctx.beginPath();
    ctx.arc(cx, cabTop - 15, 3, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawGround() {
  ctx.fillStyle = '#ded895';
  ctx.fillRect(0, H - GROUND_HEIGHT, W, GROUND_HEIGHT);
  ctx.fillStyle = '#c9bd6f';
  for (let x = groundOffset; x < W; x += 24) {
    ctx.fillRect(x, H - GROUND_HEIGHT, 12, 10);
  }
  ctx.fillStyle = '#8fae2a';
  ctx.fillRect(0, H - GROUND_HEIGHT, W, 6);
}

function hashRand(seed) {
  const x = Math.sin(seed * 12.9898) * 43758.5453;
  return x - Math.floor(x);
}

function drawAirportScenery() {
  const groundTop = H - GROUND_HEIGHT;

  // ---- Background terminal buildings, bases on the ground line ----
  const bSpacing = 130;
  const bBaseIndex = Math.floor(distanceTraveled / bSpacing);
  const bOffset = distanceTraveled - bBaseIndex * bSpacing;
  for (let k = -1; k * bSpacing - bOffset < W + bSpacing; k++) {
    const bx = k * bSpacing - bOffset;
    const tileIndex = bBaseIndex + k;
    const rnd1 = hashRand(tileIndex * 7.31 + 3.1);
    const rnd2 = hashRand(tileIndex * 2.77 + 1.4);
    const bw = 34 + rnd1 * 16;
    const bh = 26 + rnd2 * 20;
    const by = groundTop - bh;

    ctx.fillStyle = rnd1 > 0.5 ? '#9aa7b5' : '#8a97a8';
    ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = '#5c6672';
    ctx.lineWidth = 1;
    ctx.strokeRect(bx, by, bw, bh);

    // Flat roof cap
    ctx.fillStyle = '#5c6672';
    ctx.fillRect(bx - 2, by - 3, bw + 4, 4);

    // Windows grid
    ctx.fillStyle = 'rgba(190,220,235,0.85)';
    const cols = Math.max(2, Math.floor(bw / 10));
    const rows = Math.max(2, Math.floor(bh / 10));
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const wx = bx + 4 + c * ((bw - 8) / cols);
        const wy = by + 4 + r * ((bh - 8) / rows);
        ctx.fillRect(wx, wy, 4, 4);
      }
    }
  }

  // ---- Runway strip cutting across the ground band (static markings, doesn't scroll) ----
  const runwayY = groundTop + 26;
  const runwayH = 20;
  ctx.fillStyle = '#6b6f76';
  ctx.fillRect(0, runwayY, W, runwayH);
  ctx.strokeStyle = '#54585e';
  ctx.lineWidth = 1;
  ctx.strokeRect(0, runwayY, W, runwayH);

  ctx.strokeStyle = 'rgba(255,255,255,0.65)';
  ctx.lineWidth = 3;
  ctx.setLineDash([12, 10]);
  ctx.beginPath();
  ctx.moveTo(0, runwayY + runwayH / 2);
  ctx.lineTo(W, runwayY + runwayH / 2);
  ctx.stroke();
  ctx.setLineDash([]);

  // ---- Small taxiing Southwest-liveried planes on the ramp, in front of the runway ----
  const pSpacing = 190;
  const pBaseIndex = Math.floor(distanceTraveled / pSpacing);
  const pOffset = distanceTraveled - pBaseIndex * pSpacing;
  const planeY = groundTop + 60;
  for (let k = -1; k * pSpacing - pOffset < W + pSpacing; k++) {
    const tileIndex = pBaseIndex + k;
    const px = k * pSpacing - pOffset + hashRand(tileIndex * 4.2 + 9) * 40;
    drawMiniPlane(px, planeY);
  }
}

function drawMiniPlane(x, y) {
  ctx.save();
  ctx.translate(x, y);

  const len = 30;

  if (planeImgLoaded) {
    const drawW = len * 1.5;
    const drawH = drawW * PLANE_ASPECT;
    ctx.drawImage(planeImg, -drawW * 0.52, -drawH * 0.5, drawW, drawH);
  } else {
    ctx.fillStyle = '#2C4299';
    ctx.beginPath();
    ctx.ellipse(0, 0, len / 2, 3, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();
}

function drawHearts() {
  for (const h of hearts) {
    drawHeart(h.x, h.y, HEART_SIZE);
  }
}

function heartPath(size) {
  const s = size;
  const top = -s * 0.5;
  const topCurve = s * 0.32;
  ctx.beginPath();
  ctx.moveTo(0, top + topCurve);
  ctx.bezierCurveTo(0, top, -s / 2, top, -s / 2, top + topCurve);
  ctx.bezierCurveTo(-s / 2, top + (s + topCurve) / 2, 0, top + (s + topCurve) / 2, 0, top + s);
  ctx.bezierCurveTo(0, top + (s + topCurve) / 2, s / 2, top + (s + topCurve) / 2, s / 2, top + topCurve);
  ctx.bezierCurveTo(s / 2, top, 0, top, 0, top + topCurve);
  ctx.closePath();
}

function drawHeart(x, y, size) {
  ctx.save();
  ctx.translate(x, y);

  // Soft drop shadow
  ctx.save();
  ctx.translate(1.5, 2);
  heartPath(size);
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.fill();
  ctx.restore();

  // Gray/white border base (slightly larger heart behind the colored one)
  heartPath(size * 1.08);
  ctx.fillStyle = '#dfe2e5';
  ctx.fill();

  // Colored interior, clipped to a slightly smaller heart
  ctx.save();
  heartPath(size * 0.92);
  ctx.clip();

  const s = size * 0.92;
  const top = -s * 0.5;

  // Base red fill
  ctx.fillStyle = '#DC1C24';
  ctx.fillRect(-s / 2, top, s, s);

  // Gold wedge, top-right
  ctx.fillStyle = '#FFBF27';
  ctx.beginPath();
  ctx.moveTo(s * 0.04, top);
  ctx.lineTo(s / 2, top);
  ctx.lineTo(s / 2, top + s * 0.34);
  ctx.closePath();
  ctx.fill();

  // Blue section, bottom-left sweeping to the point
  ctx.fillStyle = '#2C4299';
  ctx.beginPath();
  ctx.moveTo(-s / 2, top + s * 0.3);
  ctx.lineTo(-s / 2, top + s);
  ctx.lineTo(s * 0.12, top + s);
  ctx.lineTo(s * 0.36, top + s * 0.58);
  ctx.closePath();
  ctx.fill();

  // Divider lines between the color sections
  ctx.strokeStyle = 'rgba(255,255,255,0.85)';
  ctx.lineWidth = s * 0.05;
  ctx.beginPath();
  ctx.moveTo(s * 0.04, top);
  ctx.lineTo(s / 2, top + s * 0.34);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-s / 2, top + s * 0.3);
  ctx.lineTo(s * 0.36, top + s * 0.58);
  ctx.stroke();

  ctx.restore();

  // Outer heart outline
  heartPath(size * 1.08);
  ctx.strokeStyle = 'rgba(120,124,130,0.8)';
  ctx.lineWidth = 1.2;
  ctx.stroke();

  ctx.restore();
}

function drawBird() {
  ctx.save();
  ctx.translate(bird.x, bird.y);
  ctx.rotate(bird.rotation);

  const r = bird.r;

  if (planeImgLoaded) {
    const drawW = r * 4.6;
    const drawH = drawW * PLANE_ASPECT;
    ctx.drawImage(planeImg, -drawW * 0.52, -drawH * 0.5, drawW, drawH);
  } else {
    // Simple fallback shape while the sprite loads (data URI, so this is only ever visible for an instant)
    ctx.fillStyle = '#2C4299';
    ctx.beginPath();
    ctx.ellipse(0, 0, r * 1.4, r * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  drawClouds();
  drawGround();
  drawAirportScenery();
  drawTowers();
  drawHearts();
  drawBird();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// Input handling
canvas.addEventListener('click', flap);
overlay.addEventListener('click', flap);
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    flap();
  }
});
window.addEventListener('touchstart', (e) => {
  e.preventDefault();
  flap();
}, { passive: false });

// Initial draw so the canvas isn't blank behind the overlay
draw();
loop();
</script>
</body>
</html>
